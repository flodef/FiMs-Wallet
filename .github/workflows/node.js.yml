# This workflow does a clean installation of node dependencies and builds the
# source code. Dependencies are installed with bun and pinned by the committed
# bun.lockb — without a lockfile, fresh resolution pulls in packages whose
# engine requirements can break the build.

on:
  push:
    branches: []
  pull_request:
    branches: []

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: bun install --frozen-lockfile
      - run: bun run build
